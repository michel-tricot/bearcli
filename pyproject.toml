[project]
name = "bearcli"
version = "0.1.0"
description = "CLI to read notes from the Bear note app"
readme = "README.md"
authors = [
    { name = "Michel Tricot", email = "michel.tricot@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "typer>=0.27.0",
]

[project.scripts]
bearcli = "bearcli.cli:app"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
