[project]
name = "bearcli"
version = "1.7.0"
description = "The missing open-source CLI for Bear notes - read, search, export, and manage your notes from the terminal"
readme = "README.md"
keywords = ["bear", "notes", "cli", "markdown", "macos"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
authors = [
    { name = "Michel Tricot", email = "michel.tricot@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "bearkit==1.7.0",
    "fastmcp>=3.4.5",
    "textual>=8.2.8",
    "typer>=0.27.0",
]

[project.urls]
Homepage = "https://michel-tricot.github.io/bearcli/"
Repository = "https://github.com/michel-tricot/bearcli"
Documentation = "https://github.com/michel-tricot/bearcli/blob/main/docs/IMPLEMENTATION.md"

[project.scripts]
bearcli = "bearcli.cli:app"

[tool.uv.workspace]
members = ["packages/bearkit"]

[tool.uv.sources]
bearkit = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["bearcli", "bearkit"]
