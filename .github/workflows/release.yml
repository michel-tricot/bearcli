name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC)
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check lockstep versions match the tag
        run: |
          uv run --no-project python - <<'PY'
          import os, sys, tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          cli = tomllib.load(open("pyproject.toml", "rb"))["project"]
          kit = tomllib.load(open("packages/bearkit/pyproject.toml", "rb"))["project"]
          pin = next(d for d in cli["dependencies"] if d.startswith("bearkit"))
          problems = []
          if f"v{cli['version']}" != tag:
              problems.append(f"bearcli {cli['version']} != {tag}")
          if kit["version"] != cli["version"]:
              problems.append(f"bearkit {kit['version']} != bearcli {cli['version']}")
          if pin != f"bearkit=={cli['version']}":
              problems.append(f"pin {pin!r} != bearkit=={cli['version']}")
          if problems:
              sys.exit("; ".join(problems))
          print(f"lockstep ok: {cli['version']}")
          PY

      - name: Build both packages
        run: uv build --all-packages

      - name: Publish bearkit and bearcli to PyPI
        run: uv publish --trusted-publishing always

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_PUSH_TOKEN secret is not set; tap not updated"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(sha256sum "dist/bearcli-$VERSION.tar.gz" | cut -d' ' -f1)
          # PyPI needs a moment before the just-published sdist shows up in its JSON.
          URL=""
          for _ in $(seq 1 30); do
            URL=$(curl -fsSL "https://pypi.org/pypi/bearcli/$VERSION/json" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(u['url'] for u in d['urls'] if u['packagetype']=='sdist'))") && break
            sleep 5
          done
          [ -n "$URL" ] || { echo "::error::sdist for $VERSION never appeared on PyPI"; exit 1; }
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/michel-tricot/homebrew-tap.git" tap
          cd tap
          sed -i -E "s|^  url \".*\"|  url \"$URL\"|" Formula/bearcli.rb
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"$SHA\"|" Formula/bearcli.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "bearcli $VERSION"
          git push
