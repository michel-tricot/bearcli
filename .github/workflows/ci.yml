name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff format
        run: uv run ruff format --check src packages tests scripts

      - name: Ruff lint
        run: uv run ruff check src packages tests scripts

      - name: Type check (ty)
        run: uv run ty check src packages

      - name: Tests
        run: uv run pytest tests/ -q

      - name: Docs cover every CLI command
        run: uv run python scripts/check_docs.py

      - name: CLI smoke test
        run: |
          uv run bearcli --help
          # No Bear database on CI runners; verify the error path exits cleanly.
          uv run bearcli list --db /nonexistent/database.sqlite && exit 1 || test $? -eq 1
